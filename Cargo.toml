[workspace]
resolver = "2"
members = [
    "crates/civitas_core",
    "crates/civitas_cli",
    "crates/civitas_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Civitas-1M Authors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy_ecs = { version = "0.15.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
rand = "0.8.5"
rand_chacha = "0.3.1"
rayon = "1.10.0"
indexmap = { version = "2.7.0", features = ["serde"] }
crc32fast = "1.4.2"
clap = { version = "4.5.31", features = ["derive"] }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29.1"
egui_plot = "0.29.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

