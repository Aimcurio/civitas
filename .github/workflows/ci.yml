name: CIVITAS CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civitas-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust toolchain
        shell: bash
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Formatting
        run: cargo fmt --check

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile workspace
        run: cargo check --workspace --all-targets

      - name: Debug tests
        run: cargo test --workspace --all-targets

      - name: Release tests
        run: cargo test --release --workspace --all-targets

      - name: Deterministic replay
        run: cargo run --release -p civitas_cli -- replay --seed 42 --population 10000 --ticks 100

      - name: Corrupted-save rejection
        run: cargo test --release --test simulation_tests test_corrupted_save_rejection

      - name: CLI snapshot roundtrip
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          SNAPSHOT="target/test_contract.civ"
          rm -f "$SNAPSHOT"
          trap 'rm -f "$SNAPSHOT"' EXIT

          base_requires_enhanced=0

          if [[ "$EVENT_NAME" == "pull_request" && -n "${BASE_SHA:-}" ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi

            base_source="$(git show "${BASE_SHA}:crates/civitas_cli/src/main.rs")"

            if grep -Fq 'output: Option<PathBuf>' <<<"$base_source" \
              && grep -Fq 'alias = "input"' <<<"$base_source"; then
              base_requires_enhanced=1
            fi
          fi

          echo "Base requires enhanced snapshot CLI: $base_requires_enhanced"

          if cargo run --release -p civitas_cli -- generate \
              --seed 42 \
              --population 5000 \
              --output "$SNAPSHOT"; then

            cargo run --release -p civitas_cli -- validate-save \
              --input "$SNAPSHOT"

            echo "Snapshot roundtrip mode: ENHANCED"

          else
            rm -f "$SNAPSHOT"

            if [[ "$base_requires_enhanced" -eq 1 ]]; then
              echo "::error::Enhanced snapshot CLI existed in the PR base but is unavailable in the candidate."
              exit 1
            fi

            echo "Enhanced snapshot CLI not yet present in base; verifying legacy snapshot route."

            cargo run --release -p civitas_cli -- run \
              --seed 42 \
              --population 5000 \
              --ticks 1 \
              --save-out "$SNAPSHOT"

            cargo run --release -p civitas_cli -- validate-save \
              --file "$SNAPSHOT"

            echo "Snapshot roundtrip mode: LEGACY_BASE_COMPATIBILITY"
          fi

          test -f "$SNAPSHOT"

      - name: Tracked-worktree invariant
        shell: bash
        run: |
          git diff --exit-code
